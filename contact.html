<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - My Library</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f6f8;
        }

        .navbar,
        footer {
            background-color: #1f2937;
        }

        .btn-primary {
            background-color: #1f2937;
            border-color: #1f2937;
        }

        .btn-primary:hover {
            background-color: #374151;
            border-color: #374151;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="contact.html">
            Library Management System
        </a>

        <div>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="form.html">Form</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

    <!-- Main Content -->
    <main class="container my-5 flex-grow-1">

        <div class="text-center mb-5">
            <h1 class="fw-bold">Contact Us</h1>
            <p class="text-secondary">
                Have a question? Send us a message.
            </p>
        </div>

        <!-- Contact Form -->
        <div class="row justify-content-center">

            <div class="col-12 col-lg-7">

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <form id="contactForm">

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       placeholder="Enter your name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                            <div class="mb-4">
                                <label for="messageText" class="form-label">
                                    Message
                                </label>

                                <textarea class="form-control"
                                          id="messageText"
                                          rows="4"
                                          placeholder="Write your message"
                                          required></textarea>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Send Message
                            </button>

                            <div id="successMessage"
                                class="alert alert-success mt-3 d-none"
                                role="status"
                                aria-live="polite">
                                Message submitted successfully!
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-white text-center mt-auto py-3">
        <p class="mb-0">Developed by Amna Fuad | 2026</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Form JavaScript -->
    <script>
        
    const contactForm = document.getElementById("contactForm");
    const successMessage = document.getElementById("successMessage");

    contactForm.addEventListener("submit", function(event) {
        event.preventDefault();

        successMessage.classList.remove("d-none");
        this.reset();
    });

    // Hide the success message when the user starts filling the form again
    contactForm.addEventListener("input", function() {
        successMessage.classList.add("d-none");
    });


    </script>

</body>
</html>
